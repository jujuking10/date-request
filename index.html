<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Request ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.card{
    text-align:center;
    background:rgba(255,255,255,0.08);
    padding:40px;
    border-radius:20px;
    backdrop-filter:blur(10px);
    width:90%;
    max-width:400px;
}

h1{ font-size:2.5rem; }
p{ font-size:1.2rem; }

button{
    padding:12px 25px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-size:18px;
    margin:10px;
}

#yes{ background:#22c55e; color:white; }
#no{ background:#ef4444; color:white; }

select{
    padding:10px;
    border-radius:10px;
    margin-top:10px;
    width:100%;
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="card">

<h1>Hi Jen ❤️</h1>

<p>
As an IT guy, I can deploy servers,
manage cloud infrastructure,
and troubleshoot networks...
but I still need your approval for this request.
</p>

<h2>Will you go on a date with me? 🥰</h2>

<button id="yes" onclick="yesClick()">Yes ❤️</button>
<button id="no">No 😢</button>

<!-- Choices (hidden at first) -->
<div id="choices" class="hidden">
    <h3>Pick your perfect date 💖</h3>

    <label>Type of Date:</label><br>
    <select id="dateType">
        <option value="Romantic Dinner">Romantic Dinner 🍷</option>
        <option value="Movie Night">Movie Night 🎬</option>
        <option value="Adventure">Adventure 🌄</option>
        <option value="Coffee Date">Coffee Date ☕</option>
        <option value="Chill Hangout">Chill Hangout 🛋️</option>
    </select>

    <br><br>

    <label>Food Choice:</label><br>
    <select id="food">
        <option value="Italian">Italian 🍝</option>
        <option value="Korean BBQ">Korean BBQ 🥩</option>
        <option value="Japanese">Japanese 🍣</option>
        <option value="Fast Food">Fast Food 🍔</option>
        <option value="Dessert Date">Dessert Date 🍰</option>
    </select>

    <br><br>
    <button onclick="confirmDate()">Confirm 💕</button>
</div>

<div id="result"></div>

</div>

<script>

const noBtn = document.getElementById("no");
let scale = 1;

noBtn.addEventListener("mouseover", () => {

    scale += 0.1;
    document.getElementById("yes").style.transform =
        `scale(${scale})`;

    const x = Math.random() *
        (window.innerWidth - 100);

    const y = Math.random() *
        (window.innerHeight - 50);

    noBtn.style.position = "absolute";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

function yesClick(){
    document.getElementById("choices").classList.remove("hidden");
    document.getElementById("result").innerHTML =
    "Yay! Now customize our date ❤️";
}

function confirmDate(){
    const dateType = document.getElementById("dateType").value;
    const food = document.getElementById("food").value;

    document.getElementById("result").innerHTML =
    `🎉 Date Confirmed! ❤️ <br>
     Plan: <b>${dateType}</b> <br>
     Food: <b>${food}</b> <br><br>
     Can't wait! 🥰`;
}

</script>

</body>
</html>
