<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Request ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.card{
    text-align:center;
    background:rgba(255,255,255,0.08);
    padding:40px;
    border-radius:20px;
    backdrop-filter:blur(10px);
}

h1{
    font-size:2.5rem;
}

p{
    font-size:1.2rem;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-size:18px;
    margin:10px;
}

#yes{
    background:#22c55e;
    color:white;
}

#no{
    background:#ef4444;
    color:white;
}

#result{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<h1>Hi Jen ❤️</h1>

<p>
As an IT guy, I can deploy servers,
manage cloud infrastructure,
and troubleshoot networks...
but I still need your approval for this request.
</p>

<h2>Will you go on a date with me? 🥰</h2>

<button id="yes" onclick="yesClick()">Yes ❤️</button>
<button id="no">No 😢</button>

<div id="result"></div>

</div>

<script>

const noBtn = document.getElementById("no");
let scale = 1;

noBtn.addEventListener("mouseover", () => {

    scale += 0.1;
    document.getElementById("yes").style.transform =
        `scale(${scale})`;

    const x = Math.random() *
        (window.innerWidth - 100);

    const y = Math.random() *
        (window.innerHeight - 50);

    noBtn.style.position = "absolute";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

function yesClick(){
    document.getElementById("result").innerHTML =
    "🎉 Request Approved! Date scheduled successfully ❤️";
}
</script>

</body>
</html>
